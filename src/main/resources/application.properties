spring.application.name=Cafehelp

spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=2002

app.db-migrations.enabled=true
app.db-migrations.main-location=db/migrations
app.db-migrations.tax-location=db/migrations-tax

security.jwt.secret=${SECURITY_JWT_SECRET}
internal.service.token=${INTERNAL_SERVICE_TOKEN:}
internal.api.contract-version=${INTERNAL_API_CONTRACT_VERSION:1}
python.api.url=${PYTHON_API_URL:http://localhost:8000}
python.client.connect-timeout=${PYTHON_CONNECT_TIMEOUT:3s}
python.client.read-timeout=${PYTHON_READ_TIMEOUT:30s}

tax.datasource.url=jdbc:postgresql://localhost:5433/taxdb
tax.datasource.username=postgres
tax.datasource.password=2002
tax.mytax.enabled=true
tax.mytax.inn=${TAX_MYTAX_INN:}
tax.mytax.password=${TAX_MYTAX_PASSWORD:}
tax.mytax.api-path=${TAX_MYTAX_API_PATH:https://lknpd.nalog.ru/api/v1}
tax.mytax.zone-offset=${TAX_MYTAX_ZONE_OFFSET:+03:00}
tax.mytax.prefix=${TAX_MYTAX_PREFIX:cafe_}

storage.minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
storage.minio.access-key=${MINIO_ACCESS_KEY}
storage.minio.secret-key=${MINIO_SECRET_KEY}
storage.minio.bucket=${MINIO_BUCKET:cafehelp-files}
storage.minio.public-base-url=${PUBLIC_API_BASE_URL:http://localhost:8080}
storage.minio.max-image-size-bytes=5242880
storage.minio.max-image-width=8000
storage.minio.max-image-height=8000
storage.minio.max-image-pixels=40000000
storage.minio.cleanup-enabled=true
storage.minio.cleanup-grace-hours=24
storage.minio.cleanup-batch-size=100
storage.minio.cleanup-initial-delay-ms=300000
storage.minio.cleanup-fixed-delay-ms=21600000
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

logging.level.org.springframework.security=INFO
logging.level.org.springframework.security.web.FilterChainProxy=INFO
