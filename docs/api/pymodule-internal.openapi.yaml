openapi: 3.1.0
info:
  title: CafeHelp PyModule Internal API
  version: 1.1.0
  description: Внутренний контракт Java backend и FastAPI PyModule. Версия заголовка — 1.
servers:
  - url: http://localhost:8000
tags:
  - name: System
  - name: ML
  - name: Analytics
paths:
  /health:
    get:
      tags: [System]
      summary: Liveness процесса
      responses:
        '200':
          description: Процесс работает
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Liveness'
  /ready:
    get:
      tags: [System]
      summary: Готовность API и состояние зависимостей
      responses:
        '200':
          description: Состояние готовности
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
  /api/ml/predict:
    post:
      tags: [ML]
      summary: Прогноз продаж одного блюда
      security: [{InternalServiceToken: [], InternalContractVersion: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MLRequest'
      responses:
        '200':
          description: Прогноз
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PredictionResponse'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {$ref: '#/components/responses/VersionMismatch'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/ml/predict/batch:
    post:
      tags: [ML]
      summary: Пакетный прогноз продаж
      security: [{InternalServiceToken: [], InternalContractVersion: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchMLRequest'
      responses:
        '200':
          description: Пакет прогнозов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchPredictionResponse'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {$ref: '#/components/responses/VersionMismatch'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/ml/train:
    post:
      tags: [ML]
      summary: Обучение модели
      security: [{InternalServiceToken: [], InternalContractVersion: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrainingRequest'
      responses:
        '200': {$ref: '#/components/responses/JsonObject'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409':
          description: Несовместимая версия или обучение уже выполняется
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HttpError'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /api/ml/health:
    get:
      tags: [ML]
      summary: Состояние ML-модели
      security: [{InternalServiceToken: [], InternalContractVersion: []}]
      responses:
        '200': {$ref: '#/components/responses/JsonObject'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {$ref: '#/components/responses/VersionMismatch'}
  /api/ml/info:
    get:
      tags: [ML]
      summary: Метаданные ML-модели
      security: [{InternalServiceToken: [], InternalContractVersion: []}]
      responses:
        '200': {$ref: '#/components/responses/JsonObject'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {$ref: '#/components/responses/VersionMismatch'}
  /api/ml/insights/popular-pairs:
    get:
      tags: [ML]
      summary: Популярные пары ингредиентов
      security: [{InternalServiceToken: [], InternalContractVersion: []}]
      parameters:
        - in: query
          name: limit
          schema: {type: integer, minimum: 1, maximum: 50, default: 10}
      responses:
        '200':
          description: Пары ингредиентов
          content:
            application/json:
              schema:
                type: array
                items: {type: string}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {$ref: '#/components/responses/VersionMismatch'}
  /api/ml/generate-dish:
    post:
      tags: [ML]
      summary: Генерация варианта блюда
      security: [{InternalServiceToken: [], InternalContractVersion: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GenerateDishRequest'}
      responses:
        '200': {$ref: '#/components/responses/JsonObject'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {$ref: '#/components/responses/VersionMismatch'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /api/ml/optimize:
    post:
      tags: [ML]
      summary: Оптимизация набора блюд
      security: [{InternalServiceToken: [], InternalContractVersion: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OptimizeRequest'}
      responses:
        '200': {$ref: '#/components/responses/JsonObject'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {$ref: '#/components/responses/VersionMismatch'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/analytics/dashboard:
    get:
      tags: [Analytics]
      summary: Сводный аналитический дашборд
      security: [{InternalServiceToken: [], InternalContractVersion: []}]
      parameters:
        - {$ref: '#/components/parameters/TimeRange'}
        - in: query
          name: refresh
          schema: {type: boolean, default: false}
        - in: query
          name: startDate
          schema: {type: string, format: date}
        - in: query
          name: endDate
          schema: {type: string, format: date}
      responses:
        '200': {$ref: '#/components/responses/JsonObject'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {$ref: '#/components/responses/VersionMismatch'}
        '502': {$ref: '#/components/responses/BadGateway'}
  /api/analytics/kpi:
    get:
      tags: [Analytics]
      summary: Ключевые показатели
      security: [{InternalServiceToken: [], InternalContractVersion: []}]
      parameters: [{$ref: '#/components/parameters/TimeRange'}]
      responses:
        '200': {$ref: '#/components/responses/JsonObject'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {$ref: '#/components/responses/VersionMismatch'}
        '502': {$ref: '#/components/responses/BadGateway'}
  /api/analytics/top-rolls:
    get:
      tags: [Analytics]
      summary: Топ блюд
      security: [{InternalServiceToken: [], InternalContractVersion: []}]
      parameters:
        - {$ref: '#/components/parameters/TimeRange'}
        - in: query
          name: limit
          schema: {type: integer, minimum: 1, maximum: 100, default: 10}
        - in: query
          name: sortBy
          schema: {type: string, enum: [sales, profit, margin], default: sales}
      responses:
        '200': {$ref: '#/components/responses/JsonArray'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {$ref: '#/components/responses/VersionMismatch'}
        '502': {$ref: '#/components/responses/BadGateway'}
  /api/analytics/sales-trend:
    get:
      tags: [Analytics]
      summary: Динамика продаж по дням
      security: [{InternalServiceToken: [], InternalContractVersion: []}]
      parameters:
        - {$ref: '#/components/parameters/TimeRange'}
        - in: query
          name: granularity
          schema: {type: string, enum: [day], default: day}
      responses:
        '200': {$ref: '#/components/responses/JsonArray'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {$ref: '#/components/responses/VersionMismatch'}
        '502': {$ref: '#/components/responses/BadGateway'}
  /api/analytics/insights:
    get:
      tags: [Analytics]
      summary: Аналитические подсказки
      security: [{InternalServiceToken: [], InternalContractVersion: []}]
      parameters: [{$ref: '#/components/parameters/TimeRange'}]
      responses:
        '200': {$ref: '#/components/responses/JsonArray'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {$ref: '#/components/responses/VersionMismatch'}
        '502': {$ref: '#/components/responses/BadGateway'}
components:
  securitySchemes:
    InternalServiceToken:
      type: apiKey
      in: header
      name: X-Service-Token
    InternalContractVersion:
      type: apiKey
      in: header
      name: X-Contract-Version
  parameters:
    TimeRange:
      in: query
      name: timeRange
      schema:
        type: string
        enum: [day, week, month, quarter, year]
        default: week
  responses:
    JsonObject:
      description: Успешный JSON-ответ
      content:
        application/json:
          schema: {type: object, additionalProperties: true}
    JsonArray:
      description: Успешный JSON-массив
      content:
        application/json:
          schema:
            type: array
            items: {type: object, additionalProperties: true}
    Unauthorized:
      description: Отсутствует или неверен service token
      content:
        application/json:
          schema: {$ref: '#/components/schemas/HttpError'}
    VersionMismatch:
      description: Несовместимая версия контракта
      content:
        application/json:
          schema: {$ref: '#/components/schemas/HttpError'}
    ValidationError:
      description: Ошибка валидации запроса
      content:
        application/json:
          schema: {$ref: '#/components/schemas/HttpError'}
    BadGateway:
      description: Java API недоступен или вернул некорректные данные
      content:
        application/json:
          schema: {$ref: '#/components/schemas/HttpError'}
    Unavailable:
      description: Модель или сервис временно недоступны
      content:
        application/json:
          schema: {$ref: '#/components/schemas/HttpError'}
  schemas:
    Liveness:
      type: object
      required: [status]
      properties:
        status: {type: string, const: ok}
    Readiness:
      type: object
      required: [status, modelLoaded, javaClientConnected]
      properties:
        status: {type: string, const: ready}
        modelLoaded: {type: boolean}
        javaClientConnected: {type: boolean}
    MLRequest:
      type: object
      additionalProperties: false
      required: [ingredients]
      properties:
        ingredients:
          type: array
          minItems: 1
          maxItems: 100
          items: {type: string}
        date: {type: [string, 'null'], format: date}
    BatchMLRequest:
      type: object
      additionalProperties: false
      required: [rolls]
      properties:
        rolls:
          type: array
          minItems: 1
          maxItems: 500
          items: {$ref: '#/components/schemas/MLRequest'}
    PredictionResponse:
      type: object
      required: [predictedSales, ingredients, confidenceScore]
      properties:
        predictedSales: {type: number}
        ingredients:
          type: array
          items: {type: string}
        confidenceScore:
          type: [number, 'null']
          description: Калиброванная уверенность пока не измеряется, возвращается null, не R².
        modelVersion: {type: [string, 'null']}
        target:
          type: string
          description: daily_quantity_on_sale_days для суточной модели; legacy_quantity/quantity для старой.
        warnings:
          type: array
          items: {type: string}
    BatchPredictionResponse:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items:
            oneOf:
              - {$ref: '#/components/schemas/PredictionResponse'}
              - type: object
                required: [error]
                properties:
                  error: {type: string}
        modelVersion: {type: [string, 'null']}
    TrainingRecord:
      type: object
      additionalProperties: false
      required: [ingredients, sales, date]
      properties:
        ingredients:
          type: array
          minItems: 1
          maxItems: 100
          items: {type: string}
        sales:
          type: number
          minimum: 0
          description: Сумма порций блюда за дату; Java агрегирует позиции заказов перед обучением.
        date: {type: string, format: date}
        rollName: {type: [string, 'null']}
    TrainingRequest:
      type: object
      additionalProperties: false
      required: [records]
      properties:
        records:
          type: array
          minItems: 10
          maxItems: 100000
          items: {$ref: '#/components/schemas/TrainingRecord'}
    GenerateDishRequest:
      type: object
      additionalProperties: false
      required: [salesRecords, menuItems, ingredients]
      properties:
        salesRecords: {type: array, maxItems: 10000, items: {type: object}}
        menuItems: {type: array, maxItems: 2000, items: {type: object}}
        ingredients: {type: array, minItems: 1, maxItems: 5000, items: {type: object}}
        constraints: {type: object, additionalProperties: true}
    OptimizeRequest:
      type: object
      additionalProperties: false
      properties:
        constraints: {type: object, additionalProperties: true}
        ingredients: {type: array, maxItems: 5000, items: {type: object}}
        menuItems: {type: array, maxItems: 2000, items: {type: object}}
        salesRecords: {type: array, maxItems: 10000, items: {type: object}}
    HttpError:
      type: object
      properties:
        detail: {}
