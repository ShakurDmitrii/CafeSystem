services:
  db:
    image: postgres:16-alpine
    container_name: cafehelp-db
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "2002"
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  tax_db:
    image: postgres:16-alpine
    container_name: cafehelp-tax-db
    environment:
      POSTGRES_DB: taxdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "2002"
    ports:
      - "${TAX_DB_PORT:-5433}:5432"
    volumes:
      - tax_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d taxdb"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: cafehelp-backend
    depends_on:
      db:
        condition: service_healthy
      tax_db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/postgres
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: "2002"
      TAX_DATASOURCE_URL: jdbc:postgresql://tax_db:5432/taxdb
      TAX_DATASOURCE_USERNAME: postgres
      TAX_DATASOURCE_PASSWORD: "2002"
      TAX_DISPATCH_MODE: "${TAX_PROVIDER:-SAFE}"
      TAX_DISPATCH_SOURCE_SYSTEM: "${TAX_SOURCE_SYSTEM:-cafehelp}"
      TAX_DISPATCH_PARTNER_BASE_URL: "${TAX_PARTNER_BASE_URL:-}"
      TAX_DISPATCH_PARTNER_SEND_PATH: "${TAX_PARTNER_SEND_PATH:-/api/v1/receipts}"
      TAX_DISPATCH_PARTNER_API_KEY: "${TAX_PARTNER_API_KEY:-}"
      TAX_DISPATCH_PARTNER_API_KEY_HEADER: "${TAX_PARTNER_API_KEY_HEADER:-X-API-Key}"
      TAX_DISPATCH_PARTNER_TIMEOUT_MS: "${TAX_PARTNER_TIMEOUT_MS:-15000}"
      TAX_DISPATCH_PARTNER_PROVIDER_NAME: "${TAX_PARTNER_PROVIDER_NAME:-Официальный партнер ФНС}"
      VK_BOT_API_TOKEN: "${VK_BOT_API_TOKEN:-}"
      VK_GROUP_TOKEN: "${VK_GROUP_TOKEN:-}"
      VK_GROUP_ID: "${VK_GROUP_ID:-}"
      INTERNAL_SERVICE_TOKEN: "${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN is required}"
      SECURITY_JWT_SECRET: "${SECURITY_JWT_SECRET:?SECURITY_JWT_SECRET is required}"
      # URLs to Python service must use docker DNS name (not localhost).
      # Spring relaxed binding will map these env vars to properties:
      # - python.api.url
      # - ml.python.service.url
      # - ml.service.url
      PYTHON_API_URL: http://pymodule:8000
      ML_PYTHON_SERVICE_URL: http://pymodule:8000
      ML_SERVICE_URL: http://pymodule:8000
      STORAGE_MINIO_ENDPOINT: http://minio:9000
      STORAGE_MINIO_ACCESS_KEY: minioadmin
      STORAGE_MINIO_SECRET_KEY: minioadmin123
      STORAGE_MINIO_BUCKET: cafehelp-files
      STORAGE_MINIO_PUBLIC_BASE_URL: http://localhost:9000
    ports:
      - "8080:8080"

  pymodule:
    build:
      context: ./PyModule
      dockerfile: Dockerfile
    container_name: cafehelp-pymodule
    depends_on:
      - backend
    environment:
      JAVA_API_URL: http://backend:8080
      INTERNAL_SERVICE_TOKEN: "${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN is required}"
    expose:
      - "8000"
    volumes:
      - pymodule_models:/app/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    cpus: 2.0
    mem_limit: 2g

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cafehelp-frontend
    depends_on:
      - backend
      - pymodule
    ports:
      - "3000:80"

  vkbot:
    build:
      context: ./vkbot
      dockerfile: Dockerfile
    container_name: cafehelp-vkbot
    depends_on:
      - backend
    environment:
      BACKEND_URL: http://backend:8080
      VK_GROUP_TOKEN: "${VK_GROUP_TOKEN:-}"
      VK_GROUP_ID: "${VK_GROUP_ID:-}"
      VK_BOT_API_TOKEN: "${VK_BOT_API_TOKEN:-}"
      VK_LONG_POLL_WAIT: "${VK_LONG_POLL_WAIT:-10}"
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: cafehelp-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: "minioadmin123"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  pg_data:
  tax_pg_data:
  minio_data:
  pymodule_models:
